<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:,">
<title>LocalBot 管理後台</title>
<style nonce="__NONCE__">
:root {
  --brand: #4F46E5; --brand-strong: #4338CA; --brand-soft: #EEF2FF; --on-brand: #fff;
  --accent: #0EA5E9;
  --bg: #F6F7FB; --surface: #fff; --surface-2: #F1F3F9; --border: #E2E5EF;
  --text: #1B1F2E; --muted: #667085;
  --ok: #16A34A; --ok-soft: #DCFCE7; --warn: #B45309; --warn-soft: #FEF3C7;
  --danger: #DC2626; --danger-soft: #FEE2E2;
  --shadow: 0 1px 2px rgba(16,24,40,.06), 0 4px 16px rgba(16,24,40,.06);
  --radius: 12px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --brand: #818CF8; --brand-strong: #A5B4FC; --brand-soft: #25264A; --on-brand: #12142B;
    --accent: #38BDF8;
    --bg: #0F1220; --surface: #171B2E; --surface-2: #1E2338; --border: #2B3150;
    --text: #E8EAF6; --muted: #98A2C3;
    --ok: #4ADE80; --ok-soft: #14301F; --warn: #FBBF24; --warn-soft: #3A2E10;
    --danger: #F87171; --danger-soft: #3B1D22;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.35);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  background: var(--bg); color: var(--text);
}
h1, h2, h3 { margin: 0; line-height: 1.3; }
button, input, select, textarea { font: inherit; color: inherit; }
.hidden { display: none !important; }
.muted { color: var(--muted); }
.mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px; }
.grow { flex: 1; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 12px; }

/* ---------- 按鈕與表單 ---------- */
.btn {
  border: 1px solid var(--border); background: var(--surface); border-radius: 8px;
  padding: 6px 12px; cursor: pointer; line-height: 1.4; white-space: nowrap;
}
.btn:hover { background: var(--surface-2); }
.btn:focus-visible, .nav button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .icon-btn:focus-visible {
  outline: 2px solid var(--brand); outline-offset: 1px;
}
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--on-brand); font-weight: 600; }
.btn.primary:hover { background: var(--brand-strong); }
.btn.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, var(--border)); }
.btn.danger:hover { background: var(--danger-soft); }
.btn.danger.solid { background: var(--danger); color: #fff; border-color: var(--danger); }
.btn.small { padding: 3px 8px; font-size: 12.5px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.icon-btn { border: 0; background: transparent; cursor: pointer; font-size: 16px; padding: 4px 8px; border-radius: 6px; color: var(--muted); }
.icon-btn:hover { background: var(--surface-2); }
input[type=text], input[type=password], input[type=search], select, textarea {
  width: 100%; border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 7px 10px;
}
textarea { resize: vertical; min-height: 96px; }
label.field, div.field { display: flex; flex-direction: column; gap: 4px; font-weight: 600; font-size: 13px; }
label.field > span.hint, div.field > span.hint { font-weight: 400; color: var(--muted); font-size: 12.5px; }

/* ---------- 版面 ---------- */
.shell { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
.side { background: var(--surface); border-right: 1px solid var(--border); padding: 20px 12px; display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 18px; font-weight: 700; font-size: 16px; }
.brand .logo { width: 28px; height: 28px; border-radius: 8px; background: var(--brand); color: var(--on-brand); display: grid; place-items: center; font-weight: 800; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav button { text-align: left; border: 0; background: transparent; padding: 9px 12px; border-radius: 8px; cursor: pointer; color: var(--muted); font-weight: 500; }
.nav button:hover { background: var(--surface-2); color: var(--text); }
.nav button.active { background: var(--brand-soft); color: var(--brand); font-weight: 700; }
.side .foot { margin-top: auto; padding: 10px; }
main { padding: 24px 28px 48px; min-width: 0; max-width: 1180px; width: 100%; }
.page-head { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
.page-head h2 { font-size: 20px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; }
.card h3 { font-size: 15px; margin-bottom: 12px; }
.grid { display: grid; gap: 14px; }
.grid.stats { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); margin-bottom: 14px; }
.grid.two { grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); }
.stat .label { color: var(--muted); font-size: 12.5px; }
.stat .value { font-size: 26px; font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums; }
.stat .sub { color: var(--muted); font-size: 12.5px; }

@media (max-width: 800px) {
  .shell { grid-template-columns: 1fr; }
  .side { position: static; height: auto; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px; padding: 10px 12px; border-right: 0; border-bottom: 1px solid var(--border); }
  .brand { padding: 0; grid-column: 1; grid-row: 1; }
  .side .foot { margin: 0; padding: 0; grid-column: 2; grid-row: 1; }
  .nav { flex-direction: row; overflow-x: auto; grid-column: 1 / -1; grid-row: 2; }
  .nav button { white-space: nowrap; padding: 7px 10px; }
  main { padding: 16px 14px 40px; }
}

/* ---------- 表格 ---------- */
.table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); }
table { border-collapse: collapse; width: 100%; }
th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--border); vertical-align: middle; }
th { font-size: 12.5px; color: var(--muted); font-weight: 600; background: var(--surface-2); white-space: nowrap; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr.clickable { cursor: pointer; }
tbody tr.clickable:hover { background: var(--surface-2); }
td.actions { white-space: nowrap; text-align: right; }
td .name { font-weight: 600; }
.scroll-x { overflow-x: auto; }
td.mono { white-space: nowrap; }
.empty { padding: 28px; text-align: center; color: var(--muted); }
.badge { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 99px; font-size: 12px; font-weight: 600; background: var(--surface-2); color: var(--muted); }
.badge.ok { background: var(--ok-soft); color: var(--ok); }
.badge.bad { background: var(--danger-soft); color: var(--danger); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge.brand { background: var(--brand-soft); color: var(--brand); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

/* ---------- 排程 / 日誌 ---------- */
input[type=time], input[type=number], input[type=datetime-local] { border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 7px 10px; max-width: 260px; }
.row.end { justify-content: flex-end; flex-wrap: nowrap; }
.row.center { justify-content: center; margin-top: 12px; }
.row.pick { gap: 6px; font-weight: 400; }
.pick-list { max-height: 180px; overflow-y: auto; border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; display: flex; flex-direction: column; gap: 4px; }
.grow-input { margin: 10px 0; }
textarea.mono { font-size: 12px; }

/* ---------- 登入 ---------- */
.login-wrap { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
.login { width: 100%; max-width: 360px; }
.login .brand { padding: 0 0 14px; font-size: 18px; }
.error-text { color: var(--danger); min-height: 1.4em; font-size: 13px; }

/* ---------- 圖表 ---------- */
.chart { width: 100%; height: auto; display: block; }
.chart .axis { stroke: var(--border); stroke-width: 1; }
.chart text { fill: var(--muted); font-size: 11px; }
.chart .bar-in { fill: var(--brand); }
.chart .bar-out { fill: var(--accent); }
.legend { display: flex; gap: 14px; font-size: 12.5px; color: var(--muted); margin-top: 6px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.legend i.in { background: var(--brand); } .legend i.out { background: var(--accent); }

/* ---------- 對話 ---------- */
.conv { display: flex; flex-direction: column; gap: 8px; max-height: 340px; overflow-y: auto; padding: 10px; background: var(--surface-2); border-radius: 10px; }
.bubble { max-width: 78%; padding: 7px 11px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border); align-self: flex-start; word-break: break-word; white-space: pre-wrap; }
.bubble.out { align-self: flex-end; background: var(--brand-soft); border-color: transparent; }
.bubble .meta { color: var(--muted); font-size: 11px; margin-top: 2px; }
.bubble img.thumb, .thumb { max-width: 160px; max-height: 120px; border-radius: 8px; display: block; margin-bottom: 4px; }
.summary { max-width: 420px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- Rich Menu ---------- */
.bot-avatar { width: 40px; height: 40px; border-radius: 12px; object-fit: cover; flex: none; display: grid; place-items: center; background: linear-gradient(135deg, var(--brand), var(--accent)); color: var(--on-brand); font-weight: 700; font-size: 18px; }
.bot-avatar.large { width: 72px; height: 72px; border-radius: 20px; font-size: 30px; }
.menus { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.preview { position: relative; width: 100%; background: var(--surface-2); border-radius: 8px; overflow: hidden; border: 1px solid var(--border); }
.preview img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: fill; }
.preview .area { position: absolute; border: 1.5px dashed var(--brand); background: color-mix(in srgb, var(--brand) 12%, transparent); }
.preview .noimg { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 13px; }
.kv { display: grid; grid-template-columns: 110px 1fr; gap: 6px 12px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; word-break: break-all; }
pre.ai-out { margin: 0; padding: 12px; background: var(--surface-2); border-radius: 8px; max-height: 320px; overflow: auto; white-space: pre-wrap; word-break: break-word; font: inherit; font-size: 14px; line-height: 1.55; }
.ai-key { display: grid; gap: 8px; padding: 12px 0; border-top: 1px solid var(--border); }
.ai-key:first-of-type { border-top: 0; }
.ai-row > label.field { flex: 1; min-width: 220px; }
.ai-key .hint { color: var(--muted); font-size: 12.5px; }
.ai-key input[type=password] { flex: 1; min-width: 220px; width: auto; }
input[type=number] { width: 120px; }
pre.json { margin: 0; padding: 10px; background: var(--surface-2); border-radius: 8px; overflow: auto; max-height: 360px; font-size: 12px; white-space: pre-wrap; word-break: break-all; }
.big-code { font: 700 28px/1.2 ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: .08em; text-align: center; padding: 12px; background: var(--surface-2); border-radius: 10px; user-select: all; }
.qr-wrap { display: flex; justify-content: center; }
.qr-box { background: #fff; padding: 8px; border-radius: 10px; line-height: 0; border: 1px solid var(--border); }
.page-head.sub { margin-top: 28px; }
.page-head h3 { font-size: 16px; }
.secret-value { display: block; padding: 8px 10px; background: var(--surface-2); border-radius: 8px; word-break: break-all; user-select: all; }

/* ---------- Dialog / Toast ---------- */
dialog.modal { border: 0; border-radius: 14px; padding: 0; width: min(520px, calc(100vw - 24px)); max-height: calc(100vh - 32px); background: var(--surface); color: var(--text); box-shadow: 0 20px 60px rgba(0,0,0,.35); }
dialog.modal.wide { width: min(760px, calc(100vw - 24px)); }
dialog.modal::backdrop { background: rgba(10, 12, 24, .55); }
dialog.modal[open] { display: flex; flex-direction: column; }
dialog.modal > header { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--border); }
dialog.modal > header h3 { font-size: 16px; }
dialog.modal .modal-body { padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
dialog.modal > footer { padding: 12px 16px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; }
#toasts { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 1000; max-width: calc(100vw - 32px); }
.toast { background: var(--text); color: var(--bg); padding: 10px 14px; border-radius: 10px; box-shadow: var(--shadow); font-weight: 500; }
.toast.error { background: var(--danger); color: #fff; }
.toast.ok { background: var(--ok); color: #fff; }
@media (prefers-color-scheme: dark) { .toast.ok { color: #052e14; } }
@media (prefers-reduced-motion: no-preference) { .toast { animation: pop .18s ease-out; } @keyframes pop { from { transform: translateY(6px); opacity: 0; } } }
</style>
</head>
<body>
<div id="toasts" role="status" aria-live="polite"></div>
<div id="root"></div>

<script nonce="__NONCE__">
"use strict";
/* ============================================================
 * LocalBot 管理後台前端
 * 所有來自伺服器的資料一律用 textContent / createTextNode 輸出，絕不以 HTML 字串拼接。
 * ============================================================ */
const state = { csrf: null, tab: "dashboard", timer: null, viewToken: 0, bots: [], botSel: "", serverUrl: "" };
const enc = encodeURIComponent;

// ---------- DOM 小工具 ----------
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "text") el.textContent = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "for") el.htmlFor = v;
    else if (k === "dataset") Object.assign(el.dataset, v);
    else if (k in el && k !== "list") el[k] = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid === null || kid === undefined || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
const svg = (tag, attrs, ...kids) => {
  const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs || {})) el.setAttribute(k, v);
  kids.forEach((k) => el.append(k));
  return el;
};
const $ = (sel, el = document) => el.querySelector(sel);
const pad = (n) => String(n).padStart(2, "0");
function fmtTime(ms) {
  if (!ms) return "—";
  const d = new Date(ms);
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function ago(ms) {
  if (!ms) return "—";
  const s = Math.max(0, Math.floor((Date.now() - ms) / 1000));
  if (s < 60) return "剛剛";
  if (s < 3600) return Math.floor(s / 60) + " 分鐘前";
  if (s < 86400) return Math.floor(s / 3600) + " 小時前";
  return Math.floor(s / 86400) + " 天前";
}
function fmtUptime(sec) {
  const d = Math.floor(sec / 86400), hh = Math.floor((sec % 86400) / 3600), m = Math.floor((sec % 3600) / 60);
  return d ? `${d} 天 ${hh} 小時` : hh ? `${hh} 小時 ${m} 分` : `${m} 分鐘`;
}
const num = (n) => Number(n || 0).toLocaleString("zh-TW");
function shortId(id, n = 14) { return id.length > n ? id.slice(0, n) + "…" : id; }

// ---------- Toast / Dialog ----------
function toast(message, kind = "") {
  const el = h("div", { class: "toast " + kind, text: message });
  $("#toasts").append(el);
  setTimeout(() => el.remove(), kind === "error" ? 6000 : 3200);
}
function modal({ title, content, actions = [], wide = false, onClose }) {
  const dlg = h("dialog", { class: "modal" + (wide ? " wide" : "") });
  dlg.append(
    h("header", {}, h("h3", { text: title }), h("button", { class: "icon-btn", "aria-label": "關閉", onclick: () => dlg.close() }, "✕")),
    h("div", { class: "modal-body" }, content));
  if (actions.length) dlg.append(h("footer", {}, actions.map((a) => h("button", { class: "btn " + (a.kind || ""), onclick: () => a.onClick(dlg) }, a.label))));
  dlg.addEventListener("close", () => { dlg.remove(); if (onClose) onClose(); });
  dlg.addEventListener("click", (e) => { if (e.target === dlg) dlg.close(); });
  document.body.append(dlg);
  dlg.showModal();
  return dlg;
}
function confirmBox(message, { title = "請確認", okLabel = "確定", danger = false } = {}) {
  return new Promise((resolve) => {
    let answer = false;
    modal({
      title, content: h("p", { text: message }),
      actions: [
        { label: "取消", onClick: (d) => d.close() },
        { label: okLabel, kind: danger ? "danger solid" : "primary", onClick: (d) => { answer = true; d.close(); } },
      ],
      onClose: () => resolve(answer),
    });
  });
}
function askPassword(message) {
  return new Promise((resolve) => {
    let answer = null;
    const input = h("input", { type: "password", autocomplete: "current-password", "aria-label": "管理員密碼" });
    const submit = (d) => { answer = input.value; d.close(); };
    const dlg = modal({
      title: "請輸入管理員密碼", content: [h("p", { text: message }), input],
      actions: [{ label: "取消", onClick: (d) => d.close() }, { label: "確認", kind: "primary", onClick: submit }],
      onClose: () => resolve(answer),
    });
    // preventDefault：避免同一次按鍵在對話框關閉、焦點回到原按鈕後，又被當成按下該按鈕
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); submit(dlg); } });
    input.focus();
  });
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); toast("已複製", "ok"); }
  catch { toast("瀏覽器不允許自動複製，請手動選取文字", "error"); }
}

// ---------- Bot 清單（各頁共用）----------
async function loadBots() {
  const r = await api("GET", "/bots");
  state.bots = r.bots; state.serverUrl = r.serverUrl;
  return r;
}
const botList = () => state.bots || [];
const botName = (id) => (botList().find((b) => b.botId === id) || {}).name || id || "—";
// 記住使用者上次在哪個 Bot；需要「一定要選 Bot」的頁面在沒有記錄時用第一個
function pickBot(required) {
  if (botList().some((b) => b.botId === state.botSel)) return state.botSel;
  return required ? (botList()[0] || {}).botId || "" : "";
}
function botSelect({ all = false, label = "Bot", onchange } = {}) {
  const sel = h("select", { "aria-label": label },
    all ? h("option", { value: "", text: "全部 Bot" }) : null,
    botList().map((b) => h("option", { value: b.botId, text: b.name + (b.enabled ? "" : "（已停用）") })));
  sel.value = pickBot(!all);
  sel.addEventListener("change", () => { state.botSel = sel.value; if (onchange) onchange(sel.value); });
  return sel;
}
const noBotNotice = () => h("div", { class: "card empty", text: "還沒有 Bot。請先到「Bot 與邀請碼」建立一個 Bot。" });
const botQuery = (botId) => (botId ? `&botId=${enc(botId)}` : "");

/* ---------- QR Code 產生器（byte 模式、錯誤更正 M、版本 1～10；不依賴任何外部套件） ---------- */
const QR = (() => {
  const ECC_PER_BLOCK = [-1, 10, 16, 26, 18, 24, 16, 18, 22, 22, 26];
  const NUM_BLOCKS = [-1, 1, 1, 1, 2, 2, 4, 4, 4, 5, 5];
  const MAX_VERSION = 10;
  const rawModules = (ver) => {
    let r = (16 * ver + 128) * ver + 64;
    if (ver >= 2) { const n = Math.floor(ver / 7) + 2; r -= (25 * n - 10) * n - 55; if (ver >= 7) r -= 36; }
    return r;
  };
  const dataCodewords = (ver) => Math.floor(rawModules(ver) / 8) - ECC_PER_BLOCK[ver] * NUM_BLOCKS[ver];
  const gfMul = (x, y) => { let z = 0; for (let i = 7; i >= 0; i--) { z = (z << 1) ^ ((z >>> 7) * 0x11D); z ^= ((y >>> i) & 1) * x; } return z; };
  function rsDivisor(degree) {
    const result = new Array(degree).fill(0); result[degree - 1] = 1;
    let root = 1;
    for (let i = 0; i < degree; i++) {
      for (let j = 0; j < degree; j++) { result[j] = gfMul(result[j], root); if (j + 1 < degree) result[j] ^= result[j + 1]; }
      root = gfMul(root, 0x02);
    }
    return result;
  }
  function rsRemainder(data, divisor) {
    const result = new Array(divisor.length).fill(0);
    for (const b of data) {
      const factor = b ^ result.shift(); result.push(0);
      divisor.forEach((coef, i) => { result[i] ^= gfMul(coef, factor); });
    }
    return result;
  }

async function viewSend(view, token) {

  const holder = h("div");

  let seq = 0;
  async function build() {

    if (stale(token) || mine !== seq || botId !== botSel.value) return;
    const eligible = stats.users - stats.blockedUsers;

    let target = "user";

    const userField = h("label", { class: "field" }, "收件者", userSel,
      usersRes.total > 200 ? h("span", { class: "hint", text: "只列出最近加入的 200 位；其他人請到「使用者」頁傳送" }) : null);
    const radio = (value, label) => h("label", { class: "row" }, h("input", { type: "radio", name: "target", value, checked: value === target, onchange: () => {
      target = value; userField.classList.toggle("hidden", value !== "user"); } }), label);
    const send = h("button", { class: "btn primary", onclick: async () => {
      if (!text.value.trim()) { toast("請輸入訊息內容", "error"); return; }
      if (target === "user" && !userSel.value) { toast("這個 Bot 沒有可傳送的使用者", "error"); return; }
      if (target === "broadcast" && !(await confirmBox(`這則訊息會以「${botName(botId)}」的身分傳給它全部 ${eligible} 位未封鎖的好友，確定送出？`, { title: "確認廣播", okLabel: "送出" }))) return;
      send.disabled = true;

        const r = await api("POST", "/send", body);

      } catch (e) { fail(e); }
      send.disabled = false;
    } }, "送出");
    holder.replaceChildren(h("div", { class: "card stack" },
      h("p", { class: "muted", text: "以選定 Bot 的身分傳送文字訊息，效果等同 Bot 程式呼叫 push / broadcast。使用者離線時會排入佇列，上線後送達。" }),
      h("div", { class: "row" }, radio("user", "單一使用者"), radio("broadcast", `這個 Bot 的全體好友（${eligible} 位）`)),
      userField, h("label", { class: "field" }, "訊息內容", text), h("div", { class: "row" }, counter, h("div", { class: "grow" }), send)));

function qrSvg(text, px = 220) {
  const { size, modules } = QR.encode(text);
  const quiet = 4, total = size + quiet * 2;
  let d = "";
  modules.forEach((row, y) => row.forEach((on, x) => { if (on) d += `M${x + quiet},${y + quiet}h1v1h-1z`; }));
  return svg("svg", { viewBox: `0 0 ${total} ${total}`, width: px, height: px, role: "img", "aria-label": "邀請 QR Code", "shape-rendering": "crispEdges" },
    svg("rect", { width: total, height: total, fill: "#fff" }), svg("path", { d, fill: "#000" }));
}

const WEEKDAYS = ["一", "二", "三", "四", "五", "六", "日"];
function describeSchedule(s) {
  if (s.type === "once") return "單次 " + fmtTime(s.at);
  if (s.type === "daily") return "每天 " + s.time;
  if (s.type === "weekly") return "每週" + s.days.map((d) => WEEKDAYS[d]).join("、") + " " + s.time;
  return `每月 ${s.day} 日 ${s.time}`;
}
function describeTarget(t) { return t.type === "broadcast" ? "全體廣播" : `指定 ${t.userIds.length} 位`; }
function describeMessages(msgs) {
  const first = msgs[0];
  const label = first.type === "text" ? first.text : first.type === "ai" ? `🤖 AI（${first.provider === "openai" ? "OpenAI" : "Claude"}）：${first.prompt}` : `[${first.type}]`;
  return (msgs.length > 1 ? `（${msgs.length} 則）` : "") + label;
}
function tzLabel(offsetMin) {
  const sign = offsetMin >= 0 ? "+" : "-", a = Math.abs(offsetMin);
  return `UTC${sign}${pad(Math.floor(a / 60))}:${pad(a % 60)}`;
}
function scheduleStatus(s) {
  if (s.status === "paused") return h("span", { class: "badge" }, "已停用");
  if (s.status === "done") return h("span", { class: "badge brand" }, "已執行完畢");
  return h("span", { class: "badge ok" }, h("i", { class: "dot" }), "運作中");
}
function lastResultText(s) {
  const r = s.lastResult;
  if (!r) return "尚未執行";
  const kind = { auto: "自動", manual: "手動", missed: "錯過" }[r.kind] || r.kind;
  if (r.kind === "missed") return `${kind}：${r.error || ""}`;
  return `${kind}｜送出 ${r.sent}${r.skipped ? `、略過 ${r.skipped}` : ""}${r.error ? "｜有錯誤" : ""}`;
}
function localInputValue(ms) {
  const d = new Date(ms);
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

        h("label", { class: "field" }, "名稱", name),
        h("label", { class: "field" }, "使用哪個 Bot 傳送", formBot),
        h("div", { class: "field" }, "訊息內容", h("div", { class: "row" }, msgRadio("text", "純文字"), msgRadio("ai", "🤖 AI 產生"), msgRadio("json", "進階（LINE 訊息 JSON）"))), textField, aiField, jsonField,
        h("div", { class: "field" }, "傳送對象", h("div", { class: "row" }, targetRadio("broadcast", "這個 Bot 的全體好友（略過已封鎖）"), targetRadio("users", "指定使用者"))), usersField,
        h("label", { class: "field" }, "重複方式", typeSel), onceRow, timeRow, weekRow, dayRow, tzNote, previewBox,
        h("label", { class: "row" }, enabled, "啟用這個排程"),
      ],
      actions: [{ label: "取消", onClick: (d) => d.close() }, { label: "儲存", kind: "primary", onClick: async (d) => {
        const s = readSchedule();
        if (!s) { toast("請完成時間設定", "error"); return; }
        let messages;
        try { messages = collectMessages(); } catch (e) { toast(e.message, "error"); return; }
        const target = targetType === "broadcast" ? { type: "broadcast" } : { type: "users", userIds: [...selected] };
        const body = { botId: formBot.value, name: name.value, messages, target, schedule: s, enabled: enabled.checked };
        try {
          await api(ex ? "PUT" : "POST", ex ? `/schedules/${ex.id}` : "/schedules", body);
          toast("已儲存", "ok"); d.close(); refresh();
        } catch (e) { fail(e); }
      } }],
    });
    syncMsg(); updatePreview();
    name.focus();
    return dlg;
  }

  await load();
  state.timer = setInterval(() => load().catch(() => {}), 30000);
}

// ============================================================
// Webhook 日誌
// ============================================================
const DELIVERY_STATE = {
  success: ["ok", "成功"], retrying: ["warn", "等待重試"], dead: ["bad", "已放棄"], sending: ["brand", "傳送中"],
};
function stateBadge(st) { const [cls, label] = DELIVERY_STATE[st] || ["", st]; return h("span", { class: "badge " + cls }, label); }

async function viewWebhookLog(view, token) {
  let filter = "", query = "", list = [], hasMore = false, counts = { success: 0, retrying: 0, dead: 0, sending: 0 };
  const box = h("div"), chips = h("div", { class: "row" });
  const search = h("input", { type: "search", placeholder: "搜尋使用者 ID、事件類型、事件 ID…", "aria-label": "搜尋", class: "grow-input" });
  const resendAll = h("button", { class: "btn", onclick: requeueAll }, "全部重送失敗項目");
  const botSel = botSelect({ all: true, onchange: () => load(true).catch(fail) });
  view.replaceChildren(pageHead("Webhook 日誌", botSel, resendAll), h("p", { class: "muted", text: "平台每次轉送事件給 Bot 都會記錄在這裡。連線失敗、逾時、HTTP 5xx／408／429 會自動重試（間隔遞增）；其他 4xx 表示 Bot 拒絕處理，不會重試。重送的事件帶有相同的 webhookEventId 與 isRedelivery=true。" }), chips, search, box);
  let timer = null;
  search.addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(() => { query = search.value.trim(); load(true).catch(fail); }, 300); });

  function drawChips() {
    const items = [["", "全部", counts.success + counts.retrying + counts.dead + counts.sending], ["success", "成功", counts.success], ["retrying", "等待重試", counts.retrying], ["dead", "已放棄", counts.dead]];
    chips.replaceChildren(...items.map(([v, label, n]) => h("button", { class: "btn small" + (filter === v ? " primary" : ""), onclick: () => { filter = v; load(true).catch(fail); } }, `${label} ${num(n)}`)));
    resendAll.classList.toggle("hidden", !counts.dead);
  }
  async function load(reset) {
    const before = !reset && list.length ? `&beforeId=${list[list.length - 1].id}` : "";
    const r = await api("GET", `/webhook/deliveries?limit=50&state=${enc(filter)}&q=${enc(query)}${botQuery(botSel.value)}${before}`);
    if (stale(token)) return;
    list = reset ? r.deliveries : list.concat(r.deliveries);
    hasMore = r.hasMore; counts = r.counts;
    draw();
  }
  function draw() {
    drawChips();
    if (!list.length) { box.replaceChildren(h("div", { class: "card empty", text: "沒有符合的紀錄" })); return; }
    const head = ["時間", "Bot", "使用者", "事件", "狀態", "次數", "最近結果", "下次重試", ""];
    const rows = list.map((d) => h("tr", { class: "clickable", onclick: () => openDelivery(d.id) },
      h("td", { class: "mono", text: fmtTime(d.createdAt) }),
      h("td", { text: d.botName || d.botId || "—" }),
      h("td", { class: "mono", text: d.userId ? shortId(d.userId, 16) : "—" }),
      h("td", { text: d.eventType ? d.eventType + (d.eventCount > 1 ? ` ×${d.eventCount}` : "") : "—" }),
      h("td", {}, stateBadge(d.state)),
      h("td", { text: String(d.attempts) }),
      h("td", {}, h("div", { class: "summary", text: d.state === "success" ? (d.lastStatus ? `HTTP ${d.lastStatus}` : "") : (d.lastError || "") })),
      h("td", { class: "mono", text: d.state === "retrying" && d.nextAttemptAt ? fmtTime(d.nextAttemptAt) : "—" }),
      h("td", { class: "actions" }, ["dead", "retrying"].includes(d.state)
        ? h("button", { class: "btn small", onclick: (e) => { e.stopPropagation(); resend(d.id); } }, "重送") : null)));
    box.replaceChildren(h("div", { class: "table-wrap" }, h("table", {}, h("thead", {}, h("tr", {}, head.map((t) => h("th", { text: t })))), h("tbody", {}, rows))),
      ...(hasMore ? [h("div", { class: "row center" }, h("button", { class: "btn", onclick: () => load(false).catch(fail) }, "載入更多"))] : []));
  }
  async function resend(id, dlg) {
    try {
      const r = await api("POST", `/webhook/deliveries/${id}/resend`);
      toast(r.ok ? `重送成功（HTTP ${r.status}，${r.ms} ms）` : `重送失敗：${r.error || ""}`, r.ok ? "ok" : "error");
      if (dlg) dlg.close();
      await load(true);
    } catch (e) { fail(e); }
  }
  async function requeueAll() {
    if (!(await confirmBox(`把 ${counts.dead} 筆已放棄的轉送全部排回佇列，由背景逐一重送？`, { title: "全部重送", okLabel: "重送" }))) return;
    try { const r = await api("POST", "/webhook/deliveries/resend-failed", { confirm: true }); toast(`已排入 ${r.queued} 筆`, "ok"); await load(true); } catch (e) { fail(e); }
  }
  async function openDelivery(id) {
    try {
      const d = await api("GET", `/webhook/deliveries/${id}`);
      let pretty = d.body;
      try { pretty = JSON.stringify(JSON.parse(d.body), null, 2); } catch { /* 原樣顯示 */ }
      const attempts = d.attemptLog.length
        ? h("div", { class: "table-wrap" }, h("table", {}, h("thead", {}, h("tr", {}, ["#", "時間", "方式", "結果", "耗時"].map((t) => h("th", { text: t })))),
          h("tbody", {}, d.attemptLog.map((a) => h("tr", {}, h("td", { text: String(a.no) }), h("td", { class: "mono", text: fmtTime(a.at) }), h("td", { text: a.manual ? "手動" : "自動" }),
            h("td", {}, a.ok ? h("span", { class: "badge ok" }, `HTTP ${a.status}`) : h("span", { class: "badge bad" }, a.error || "失敗")), h("td", { text: a.ms + " ms" }))))))
        : h("div", { class: "muted", text: "尚無嘗試紀錄" });
      const dlg = modal({
        title: `轉送 #${d.id}`, wide: true,
        content: [
          h("dl", { class: "kv" },
            h("dt", { text: "狀態" }), h("dd", {}, stateBadge(d.state)),
            h("dt", { text: "Bot" }), h("dd", { text: `${d.botName || "—"}（${d.botId || "—"}）` }),
            h("dt", { text: "使用者" }), h("dd", { class: "mono", text: d.userId || "—" }),
            h("dt", { text: "事件" }), h("dd", { text: `${d.eventType || "—"}${d.eventCount > 1 ? ` ×${d.eventCount}` : ""}` }),
            h("dt", { text: "事件 ID" }), h("dd", { class: "mono", text: d.eventId || "—" }),
            h("dt", { text: "建立時間" }), h("dd", { text: fmtTime(d.createdAt) }),
            d.state === "retrying" ? [h("dt", { text: "下次重試" }), h("dd", { text: fmtTime(d.nextAttemptAt) })] : null),
          h("h3", { text: "嘗試紀錄" }), attempts,
          h("h3", { text: "事件內容" }), h("pre", { class: "json", text: pretty }),
        ],
        actions: ["dead", "retrying", "success"].includes(d.state)
          ? [{ label: d.state === "success" ? "再送一次" : "立即重送", kind: "primary", onClick: async (x) => {
            if (d.state === "success" && !(await confirmBox("這筆已經成功送達，確定要再送一次給 Bot？Bot 可能會重複處理。", { okLabel: "再送一次" }))) return;
            resend(d.id, x);
          } }] : [],
      });
    } catch (e) { fail(e); }
  }
  await load(true);
  state.timer = setInterval(() => load(true).catch(() => {}), 10000);
}

// ---------- 啟動 ----------
(async function boot() {
  try {
    const r = await api("GET", "/session", undefined, { noAuthRedirect: true });
    if (r.authenticated) { state.csrf = r.csrf; showApp(); } else showLogin();
  } catch { showLogin("無法連線到伺服器"); }
})();
</script>
</body>
</html>
