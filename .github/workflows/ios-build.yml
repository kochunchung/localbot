name: iOS Build (unsigned)

on:
  push:
    branches: [main]
    paths: ["flutter_app/**", ".github/workflows/ios-build.yml"]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: flutter_app/localbot_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter --version
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - uses: actions/upload-artifact@v4
        with:
          name: ios-runner-app
          path: flutter_app/localbot_app/build/ios/iphoneos/Runner.app
